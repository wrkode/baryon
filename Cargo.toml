[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-rc1"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/wrkode/baryon"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
baryon-api = { path = "crates/api" }
baryon-cloud-hypervisor = { path = "crates/cloud-hypervisor" }
baryon-host = { path = "crates/host" }
baryon-runtime-api = { path = "crates/runtime-api" }
baryon-version = { path = "crates/version" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dhcproto = "0.15.0"
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
bytes = "1.12.1"
ipnet = "2"
k8s-openapi = { version = "0.28.0", default-features = false, features = ["schemars"] }
kube = { version = "4.2.0", default-features = false }
libc = "0.2"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
netlink-sys = "0.9.0"
prometheus-client = "0.25.1"
prost = "0.14.4"
protox = "0.9.1"
rtnetlink = "0.23.0"
rustix = { version = "1.1.5", features = ["fs", "process", "system", "thread", "net", "mount", "pipe", "event"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs", "process"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = "0.7.19"
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
