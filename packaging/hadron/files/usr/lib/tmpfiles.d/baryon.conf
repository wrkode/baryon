# Persistent log directory (/var/log is a persistent bind mount on Kairos).
d /var/log/baryon 0750 root root -
# Per-VM logs, one directory per Anchor Pod: console output, Cloud
# Hypervisor log, DHCP responder log. Each start, restart, and node reboot
# creates a new one, and console output can contain credentials, so
# systemd-tmpfiles-clean removes entries untouched for 14 days. Shipped in
# the image (/usr/lib); override with a file of the same name in
# /etc/tmpfiles.d.
d /var/log/baryon/vms 0700 root root 14d
