name: release

# Builds, attests, and publishes a release when a version tag is pushed. A
# manual run is a dry run: it runs the gate and the build of the selected
# branch and publishes nothing. See docs/release.md.
#
# Jobs and their privileges:
#   gate     read-only: tag, version, main ancestry, CI on the exact commit,
#            release qualification status (hack/release-gate.sh)
#   build    read-only: every release file and image as an OCI layout whose
#            digest is the published digest, SBOMs, checksums, identity
#            checks (hack/release-build.sh)
#   attest   OIDC identity and attestation write only: build provenance
#            for the release files and the image digests
#   publish  package and release write only: copies the OCI layouts to
#            ghcr.io unchanged, checks the digests, creates the release
# No job runs code from a pull request: the workflow has no pull request
# trigger.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # CI runs of the commit
      statuses: read # release qualification status of the commit
    outputs:
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: hack/release-gate.sh

  build:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit is the gated commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.gate.outputs.sha }}"
      - name: syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Build and check the release
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: hack/release-build.sh "$VERSION"
      - name: Release notes
        run: cp "docs/release-notes/$VERSION.md" _oci/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: _release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci
          path: _oci/
          if-no-files-found: error

  attest:
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Sigstore signing identity of this workflow run
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: _release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci
          path: _oci
      - name: Image digests
        id: digests
        run: |
          (cd _release && sha256sum --check --strict SHA256SUMS)
          while read -r name digest; do
            echo "${name//-/_}=$digest" >> "$GITHUB_OUTPUT"
          done < _oci/digests
      - name: Provenance of the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "_release/*"
      - name: Provenance of the anchor image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/baryon-anchor
          subject-digest: ${{ steps.digests.outputs.baryon_anchor }}
      - name: Provenance of the importer image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/baryon-importer
          subject-digest: ${{ steps.digests.outputs.baryon_importer }}
      - name: Provenance of the node agent image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/baryon-node-agent
          subject-digest: ${{ steps.digests.outputs.baryon_node_agent }}
      - name: Provenance of the controller image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/baryon-controller
          subject-digest: ${{ steps.digests.outputs.baryon_controller }}
      - name: Provenance of the host image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/baryon-hadron
          subject-digest: ${{ steps.digests.outputs.baryon_hadron }}

  publish:
    needs: [gate, build, attest]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      packages: write # push the images to ghcr.io
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: _release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci
          path: _oci
      - name: Push the images unchanged and check their digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd _release && sha256sum --check --strict SHA256SUMS)
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          while read -r name digest; do
            tag="$VERSION"
            [ "$name" = baryon-hadron ] && tag="$VERSION-k0s"
            test "sha256:$(skopeo inspect --raw "oci:_oci/$name:$tag" | sha256sum | cut -d' ' -f1)" = "$digest"
            skopeo copy --preserve-digests "oci:_oci/$name:$tag" "docker://$REGISTRY/$name:$tag"
            test "sha256:$(skopeo inspect --raw "docker://$REGISTRY/$name@$digest" | sha256sum | cut -d' ' -f1)" = "$digest"
            test "$(skopeo inspect --format '{{.Digest}}' "docker://$REGISTRY/$name:$tag")" = "$digest"
            echo "$REGISTRY/$name:$tag $digest"
          done < _oci/digests
          skopeo logout ghcr.io
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$VERSION" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "Baryon $VERSION" --notes-file _oci/release-notes.md _release/*
          want=false
          [ "${#prerelease[@]}" -eq 0 ] || want=true
          test "$(gh api "repos/$REPO/releases/tags/$VERSION" --jq .prerelease)" = "$want"
          test "$(gh api "repos/$REPO/releases/tags/$VERSION" --jq '.assets | length')" = "$(ls _release | wc -l)"
