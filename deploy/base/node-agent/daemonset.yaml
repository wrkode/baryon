apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: baryon-node-agent
  namespace: baryon-system
  labels:
    app.kubernetes.io/name: baryon-node-agent
    app.kubernetes.io/part-of: baryon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: baryon-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baryon-node-agent
        app.kubernetes.io/part-of: baryon
    spec:
      serviceAccountName: baryon-node-agent
      # Only nodes that run baryon-virtd are Baryon hosts.
      nodeSelector:
        virtualization.baryon.io/host: "true"
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: node-agent
          image: baryon/node-agent:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            # uid 0 owns the kubelet device plugin directory; no capabilities.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: virtd-node
              mountPath: /run/baryon/node
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            # Fixed kubelet path, independent of the kubelet root directory
            # (also /var/lib/kubelet/device-plugins on k0s).
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: virtd-node
          hostPath:
            path: /run/baryon/node
            type: Directory
