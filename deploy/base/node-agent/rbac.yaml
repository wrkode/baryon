apiVersion: v1
kind: ServiceAccount
metadata:
  name: baryon-node-agent
  namespace: baryon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baryon-node-agent
rules:
  # Read the Node to set the VirtualizationNode owner reference.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # Each agent writes the VirtualizationNode named after its node. RBAC cannot
  # restrict this to one object name per agent; see docs/security.md.
  - apiGroups: ["virtualization.baryon.io"]
    resources: ["virtualizationnodes"]
    verbs: ["get", "create"]
  - apiGroups: ["virtualization.baryon.io"]
    resources: ["virtualizationnodes/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: baryon-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: baryon-node-agent
subjects:
  - kind: ServiceAccount
    name: baryon-node-agent
    namespace: baryon-system
