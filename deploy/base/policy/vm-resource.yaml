# Only baryon-controller may create pods that request the
# virtualization.baryon.io/vm or virtualization.baryon.io/import extended
# resources.
#
# The device plugin hands /dev/kvm and the baryon-virtd anchor socket to every
# container allocated the vm resource, so that resource is the gate to the
# node runtime. The import resource grants nothing; it is restricted so that
# other pods cannot use up the slots that place import Pods. baryon-virtd additionally requires each anchor to run as the uid
# derived from its VM (see docs/security.md); this policy keeps arbitrary pods
# from reaching the socket at all.
#
# Requires ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1,
# Kubernetes 1.30 or later). The service account name must match
# deploy/base/controller/rbac.yaml.
#
# Such a pod must also keep its own PID namespace and the default host PID
# namespace isolation: baryon-virtd accepts lifecycle calls only from the
# init process of the Anchor container's PID namespace (ADR 0015), which
# `shareProcessNamespace` (the pause process becomes PID 1) or `hostPID`
# would break. baryon-controller never sets either; the validations refuse a
# mutating webhook that does. For the same reason such a pod has exactly the
# one container baryon-controller creates, no init containers, and runs in
# the host user namespace (the supervisor check requires the initial user
# namespace). Every container drops all capabilities, adds none, and is
# neither privileged nor allowed to escalate privileges: without
# CAP_SYS_ADMIN no process in the container can create a PID namespace of
# its own in the initial user namespace and be its init.
#
#
# Such a pod also gets no other host access than its claim gives it: no
# host network namespace (baryon-virtd would hand the VM's network to the
# pod's network namespace, the host's), no host IPC namespace, no host
# ports, and only the volume types baryon-controller uses (the root disk
# claim and, for an import Pod, the downward API approval file), so no
# hostPath. baryon-controller sets none of these; the validations refuse a
# mutating webhook or a controller defect that does (docs/security.md,
# host integration policy).
#
# Only CREATE is checked: container resources and these fields cannot be
# changed on an existing pod (in-place resize covers CPU and memory only).
# Container images can be; policy/pod-immutable.yaml refuses that.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: baryon-vm-resource
  labels:
    app.kubernetes.io/part-of: baryon
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: requests-baryon-resource
      expression: >-
        [object.spec.containers,
         has(object.spec.initContainers) ? object.spec.initContainers : []].exists(cs,
          cs.exists(c, has(c.resources) &&
            ['virtualization.baryon.io/vm', 'virtualization.baryon.io/import'].exists(r,
              (has(c.resources.limits) && r in c.resources.limits) ||
              (has(c.resources.requests) && r in c.resources.requests))))
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:baryon-system:baryon-controller'"
      messageExpression: >-
        'only baryon-controller may create pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import; requested by ' + request.userInfo.username
      reason: Forbidden
    - expression: "!has(object.spec.shareProcessNamespace) || !object.spec.shareProcessNamespace"
      message: "pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import must not share the process namespace (shareProcessNamespace)"
      reason: Forbidden
    - expression: "!has(object.spec.hostPID) || !object.spec.hostPID"
      message: "pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import must not use the host PID namespace (hostPID)"
      reason: Forbidden
    - expression: "size(object.spec.containers) == 1 && (!has(object.spec.initContainers) || size(object.spec.initContainers) == 0)"
      message: "pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import must have exactly one container and no init containers"
      reason: Forbidden
    - expression: "!has(object.spec.hostUsers) || object.spec.hostUsers"
      message: "pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import must run in the host user namespace (hostUsers)"
      reason: Forbidden
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation &&
          has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&
          'ALL' in c.securityContext.capabilities.drop &&
          (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: "containers of pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import must drop all capabilities, add none, and not be privileged or allow privilege escalation"
      reason: Forbidden
    - expression: "(!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: "pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import must not use the host network or IPC namespace (hostNetwork, hostIPC)"
      reason: Forbidden
    - expression: "object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))"
      message: "containers of pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import must not use host ports"
      reason: Forbidden
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.persistentVolumeClaim) || has(v.downwardAPI))"
      message: "pods that request virtualization.baryon.io/vm or virtualization.baryon.io/import may use only persistentVolumeClaim and downwardAPI volumes (no hostPath, no service account token)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: baryon-vm-resource
  labels:
    app.kubernetes.io/part-of: baryon
spec:
  policyName: baryon-vm-resource
  validationActions: [Deny]
