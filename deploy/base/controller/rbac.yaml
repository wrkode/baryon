apiVersion: v1
kind: ServiceAccount
metadata:
  name: baryon-controller
  namespace: baryon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: baryon-controller
rules:
  - apiGroups: ["virtualization.baryon.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["virtualization.baryon.io"]
    resources: ["virtualmachines/status"]
    verbs: ["patch"]
  - apiGroups: ["virtualization.baryon.io"]
    resources: ["virtualmachines/finalizers"]
    verbs: ["update"]
  - apiGroups: ["virtualization.baryon.io"]
    resources: ["virtualmachineclasses"]
    verbs: ["get", "list", "watch"]
  # Host-side state of the VMs on each node (NetworkReady).
  - apiGroups: ["virtualization.baryon.io"]
    resources: ["virtualizationnodes"]
    verbs: ["get", "list", "watch"]
  # patch: only the import approval annotation on Baryon pods
  # (policy/controller-writes.yaml).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create"]
  # The import record on the bound volume (ADR 0006). patch is limited to
  # adding that annotation once (policy/controller-writes.yaml).
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: baryon-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: baryon-controller
subjects:
  - kind: ServiceAccount
    name: baryon-controller
    namespace: baryon-system
